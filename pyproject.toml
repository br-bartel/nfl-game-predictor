[project]
name = "nflpred"
version = "0.1.0"
description = "Weekly NFL game margin and win-probability predictions, scored against Vegas lines."
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow",
    "duckdb>=1.0",
    "pandas",
    "scikit-learn>=1.5",
    "scipy",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nflpred"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
